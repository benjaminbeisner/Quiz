{% extends "base.html" %}

{% block title %}Passwort ändern - Quiz Modul{% endblock %}

{% block content %}
<div class="row justify-content-center mt-5">
    <div class="col-md-5">
        <div class="card shadow-sm border-0">
            <div class="card-header bg-dark text-white text-center py-3">
                <h4 class="mb-0">🔒 Passwort ändern</h4>
            </div>
            <div class="card-body p-4">
                {% if error %}
                    <div class="alert alert-danger text-center">{{ error }}</div>
                {% endif %}

                <div class="alert alert-info small mb-4">
                    Aus Sicherheitsgründen musst du dein Passwort ändern, bevor du fortfahren kannst.
                </div>

                <form method="POST" action="/change-password">
                    <div class="mb-3">
                        <label class="form-label fw-bold">Aktuelles Passwort</label>
                        <input type="password" name="old_password" class="form-control" required placeholder="Bisheriges Passwort">
                    </div>
                    <div class="mb-3">
                        <label class="form-label fw-bold">Neues Passwort</label>
                        <input type="password" name="new_password" class="form-control" required placeholder="Mindestens 6 Zeichen">
                    </div>
                    <div class="mb-4">
                        <label class="form-label fw-bold">Neues Passwort wiederholen</label>
                        <input type="password" name="confirm_password" class="form-control" required placeholder="Passwort bestätigen">
                    </div>
                    <button type="submit" class="btn btn-primary w-100 fw-bold py-2">Passwort aktualisieren</button>
                </form>
            </div>
        </div>
    </div>
</div>
{% endblock %}
