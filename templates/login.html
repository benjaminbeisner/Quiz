{% extends "base.html" %}

{% block title %}Login - Quiz Modul{% endblock %}

{% block content %}
<div class="row justify-content-center mt-5">
    <div class="col-md-5">
        <div class="card shadow-sm border-0">
            <div class="card-header bg-dark text-white text-center py-3">
                <h4 class="mb-0">🔑 Anmelden</h4>
            </div>
            <div class="card-body p-4">
                {% if error %}
                    <div class="alert alert-danger text-center">{{ error }}</div>
                {% endif %}

                <form method="POST" action="/login">
                    <div class="mb-3">
                        <label class="form-label fw-bold">Benutzername</label>
                        <input type="text" name="username" class="form-control" required autocorrect="off" autocapitalize="off" placeholder="Dein Benutzername">
                    </div>
                    <div class="mb-4">
                        <label class="form-label fw-bold">Passwort</label>
                        <input type="password" name="password" class="form-control" required placeholder="Dein Passwort">
                    </div>
                    <button type="submit" class="btn btn-primary w-100 fw-bold mb-4">Einloggen</button>
                </form>

                <hr class="text-muted">

                <div class="text-center mt-3">
                    <p class="text-muted small mb-2">Du bist neu hier und möchtest deine Ergebnisse speichern?</p>
                    <a href="/register" class="btn btn-outline-secondary w-100 fw-bold">Registrierung anfragen</a>
                </div>
            </div>
        </div>
    </div>
</div>
{% endblock %}
