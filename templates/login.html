{% extends "base.html" %}

{% block title %}Login - Quiz Modul{% endblock %}

{% block content %}
<div class="row justify-content-center">
    <div class="col-md-5">
        <div class="card mt-5">
            <div class="card-body p-4">
                <h3 class="text-center mb-4">Anmeldung</h3>
                
                {% if error %} 
                    <div class="alert alert-danger">{{ error }}</div> 
                {% endif %}
                
                <form method="POST" action="/login">
                    <div class="mb-3">
                        <label class="form-label">Benutzername</label>
                        <!-- autocorrect und autocapitalize auf off, damit Handys "admin" nicht ungewollt großschreiben -->
                        <input type="text" name="username" class="form-control" required autofocus autocorrect="off" autocapitalize="off">
                    </div>

                    <div class="mb-4">
                        <label class="form-label">Passwort</label>
                        <div class="input-group">
                            <input type="password" id="login_password" name="password" class="form-control" required>
                            <button class="btn btn-outline-secondary" type="button" onclick="toggleLoginPw()">👁️</button>
                        </div>
                    </div>

                    <button type="submit" class="btn btn-primary w-100 mb-3">Einloggen</button>
                </form>

                <div class="text-center">
                    <a href="/" class="text-decoration-none">← Zurück zur Startseite</a>
                </div>
            </div>
        </div>
    </div>
</div>

<script>
    function toggleLoginPw() {
        const pwField = document.getElementById("login_password");
        pwField.type = pwField.type === "password" ? "text" : "password";
    }
</script>
{% endblock %}
