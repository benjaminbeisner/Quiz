{% extends "base.html" %}

{% block title %}Quiz Konfiguration{% endblock %}

{% block content %}
<div class="row justify-content-center">
    <div class="col-md-6">
        <div class="card mt-4">
            <div class="card-header bg-dark text-white">
                <h4 class="mb-0">{{ quiz.title }} konfigurieren</h4>
            </div>
            <div class="card-body">
                {% if error %}
                    <div class="alert alert-warning">{{ error }}</div>
                {% endif %}

                <p>Dieses Quiz enthält insgesamt <strong>{{ total_questions }}</strong> Fragen.</p>

                <form method="POST" action="/quiz/{{ quiz.id }}/run">
                    <div class="mb-4">
                        <label class="form-label">Wie viele Fragen möchtest du beantworten?</label>
                        <select name="limit" class="form-select" required>
                            <option value="20" {% if total_questions < 20 %}disabled{% endif %}>20 Fragen</option>
                            <option value="50" {% if total_questions < 50 %}disabled{% endif %}>50 Fragen</option>
                            <option value="all">Alle Fragen ({{ total_questions }})</option>
                        </select>
                    </div>

                    <div class="d-flex justify-content-between">
                        <a href="/" class="btn btn-outline-secondary">Abbrechen</a>
                        <button type="submit" class="btn btn-success" {% if total_questions == 0 %}disabled{% endif %}>Loslegen!</button>
                    </div>
                </form>
            </div>
        </div>
    </div>
</div>
{% endblock %}
